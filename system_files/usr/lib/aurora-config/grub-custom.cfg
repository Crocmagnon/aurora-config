# Copié dans /boot/grub2/custom.cfg par aurora-config-grub.service. La config GRUB de bootupd le lit
# en dernier : ces valeurs remplacent son timeout=1.
# Menu visible 5 s : première entrée, la version actuelle ; deuxième, la version précédente.
set timeout_style=menu
set timeout=5

# Thème Breeze de KDE, copié par le même service.
if [ -f $prefix/themes/breeze/theme.txt ]; then
  load_video
  set gfxmode=auto
  terminal_output gfxterm
  loadfont $prefix/themes/breeze/unifont-regular-14.pf2
  loadfont $prefix/themes/breeze/unifont-regular-16.pf2
  loadfont $prefix/themes/breeze/unifont-bold-16.pf2
  set theme=$prefix/themes/breeze/theme.txt
fi
